description: Hello and welcome to my personal website. I share my blog and an overview of my professional work. I hold a Ph.D. in Genetics and Plant Breeding, with a research focus on genomics, computational biology, statistical genetics, and polyploid species. Originally from Brazil, I now live in Ithaca, NY, and serve as Genomics Coordinator for Breeding Insight at University of Florida.
